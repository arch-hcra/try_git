name: CI

on:
  push:
    branches:
      - main

jobs:
  ubuntu-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run tests in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app python:3.8 bash -c "pip install pytest && pytest"

  debian-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run tests in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app debian:latest bash -c "apt-get update && apt-get install -y python3 python3-pip && pip3 install pytest && pytest"

  centos-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run tests in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app centos:latest bash -c "yum install -y python3 python3-pip && pip3 install pytest && pytest"
