name: CI

on:
  push:
    branches:
      - main

jobs:
  debian-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run tests in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app debian:latest bash -c "
            apt-get update && 
            apt-get install -y python3 python3-pip python3-venv && 
            python3 -m venv venv && 
            . venv/bin/activate && 
            pip install --no-cache-dir pytest && 
            pytest
          "